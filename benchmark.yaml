id: perturbation_status_estimation
description: "Complete perturbation-status estimation benchmark across Papalexi 2021, Norman 2019 and Replogle 2022."
version: "0.5.0"
benchmarker: "Yunzhe Liu, richelieu.xmas@gmail.com"

software_backend: conda
software_environments:
  common:
    description: "Pinned Python data and benchmark utilities."
    conda: envs/common.yml
  mixscape:
    description: "Python 3.12, R 4.5.3, Seurat plus module-bundled pinned method sources."
    conda: envs/mixscape.yml
  mixscale:
    description: "Python 3.12, R 4.5.3, Mixscale runtime dependencies."
    conda: envs/mixscale.yml
  ps:
    description: "Python 3.12, R 4.5.3, scMAGeCK PS runtime dependencies."
    conda: envs/ps.yml

stages:
  - id: data
    modules:
      - id: papalexi2021
        name: "Papalexi 2021 standardized input"
        software_environment: common
        repository:
          url: git@github.com:scprocess-perturb-benchmarks/perturbation-status-data.git
          commit: 1348f9d7a2d0d9a8f5367e9b57b992127a77031a
        parameters:
          - h5ad: /data/yunzliu/perturbation_status_estimation_benchmark/01_standardize_inputs/outputs/papalexi2021/perturbation_adata.h5ad
      - id: norman2019
        name: "Norman 2019 standardized input"
        software_environment: common
        repository:
          url: git@github.com:scprocess-perturb-benchmarks/perturbation-status-data.git
          commit: 1348f9d7a2d0d9a8f5367e9b57b992127a77031a
        parameters:
          - h5ad: /data/yunzliu/perturbation_status_estimation_benchmark/01_standardize_inputs/outputs/norman2019/perturbation_adata.h5ad
      - id: replogle2022
        name: "Replogle 2022 standardized input"
        software_environment: common
        repository:
          url: git@github.com:scprocess-perturb-benchmarks/perturbation-status-data.git
          commit: 1348f9d7a2d0d9a8f5367e9b57b992127a77031a
        parameters:
          - h5ad: /data/yunzliu/perturbation_status_estimation_benchmark/01_standardize_inputs/outputs/replogle2022/perturbation_adata.h5ad
    outputs:
      - { id: data.h5ad, path: "{dataset}.h5ad" }
      - { id: data.spec, path: "{dataset}.spec.json" }

  - id: shared_signature
    resources: { cores: 4, mem_mb: 100000 }
    modules:
      - id: calc_perturb_sig
        name: "Shared CalcPerturbSig signature and frozen target shards"
        software_environment: mixscape
        repository:
          url: git@github.com:scprocess-perturb-benchmarks/perturbation-status-mixscape-mixscale.git
          commit: 599bfa03a446e7f8c0bf65d6f0b3a3c10af0f04b
          entrypoint: shared
    inputs:
      - data.h5ad
      - data.spec
    outputs:
      - { id: shared_signature.bundle, path: "shared_signature.tar.gz" }
      - { id: shared_signature.manifest, path: "shared_manifest.json" }

  - id: status_estimation
    resources: { cores: 4, mem_mb: 100000 }
    modules:
      - id: mixscape
        name: "Mixscape perturbation-status estimation"
        software_environment: mixscape
        repository:
          url: git@github.com:scprocess-perturb-benchmarks/perturbation-status-mixscape-mixscale.git
          commit: 599bfa03a446e7f8c0bf65d6f0b3a3c10af0f04b
        parameters:
          - method: mixscape
            workers: 4
      - id: mixscale
        name: "Mixscale perturbation-status estimation"
        software_environment: mixscale
        repository:
          url: git@github.com:scprocess-perturb-benchmarks/perturbation-status-mixscape-mixscale.git
          commit: 599bfa03a446e7f8c0bf65d6f0b3a3c10af0f04b
        parameters:
          - method: mixscale
            workers: 4
      - id: ps
        name: "PS perturbation-status estimation"
        software_environment: ps
        repository:
          url: git@github.com:scprocess-perturb-benchmarks/perturbation-status-ps.git
          commit: e9d67f011290262ecc88be47e3e0628b27a4bbef
        parameters:
          - workers: 4
    inputs:
      - data.h5ad
      - data.spec
      - shared_signature.bundle
    outputs:
      - { id: status_estimation.result, path: "status_result.tsv.gz" }
      - { id: status_estimation.manifest, path: "method_manifest.json" }
      - { id: status_estimation.aux, path: "method_aux.tar.gz" }

metric_collectors:
  - id: benchmark
    name: "Complete data-only perturbation-status benchmark"
    software_environment: mixscale
    resources: { cores: 16, mem_mb: 120000 }
    repository:
      url: git@github.com:scprocess-perturb-benchmarks/perturbation-status-metrics.git
      commit: 5a5abcb2a32bc8d867b9d863ff1461a8b40cbd93
    inputs:
      - data.h5ad
      - data.spec
      - shared_signature.bundle
      - shared_signature.manifest
      - status_estimation.result
      - status_estimation.manifest
      - status_estimation.aux
    outputs:
      - { id: benchmark.summary, path: "benchmark_summary.tsv" }
      - { id: benchmark.results, path: "benchmark_results.tar.gz" }
      - { id: benchmark.manifest, path: "benchmark_manifest.json" }
      - { id: benchmark.parity, path: "parity_report.json" }
